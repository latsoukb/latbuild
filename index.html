<!doctype html><html><head><meta charset=utf8><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LatBuild"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0d0f12"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LatBuild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Bumper-plate day picker on top (IWF plate colours: 25 kg red = Jour 1, 20 kg blue = Jour 2, 15 kg yellow = Jour 3, 10 kg green = done), machine checklist below, fixed tab bar. Dark by request. */
:root{
  color-scheme:dark;
  --bg:#0d0f12;
  --panel:#15181d;
  --panel2:#1d2128;
  --line:#272d36;
  --fg:#eceff3;
  --muted:#8d96a4;
  --faint:#58616f;
  --red:#ef4b4f;
  --blue:#4a90ff;
  --yellow:#f4c430;
  --green:#33c48a;
  --acc:var(--red);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 150px}
.app[data-day="j1"]{--acc:var(--red)}
.app[data-day="j2"]{--acc:var(--blue)}
.app[data-day="j3"]{--acc:var(--yellow)}
.app[data-tab="progres"],.app[data-tab="idees"]{--acc:var(--green)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand b{color:var(--acc);font-weight:800;transition:color .25s}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="cloud"] i{background:var(--green)}
.sync[data-s="local"] i{background:var(--yellow)}

/* plates */
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-block:4px 18px}
.plate{--pc:var(--red);position:relative;width:100%;max-width:128px;aspect-ratio:1;justify-self:center;border-radius:50%;background:var(--panel);border:8px solid var(--line);border-color:color-mix(in srgb,var(--pc) 28%,var(--panel));display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);transition:border-color .2s,transform .2s,box-shadow .2s}
.plate::before{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid var(--line)}
.plate[data-d="j2"]{--pc:var(--blue)}
.plate[data-d="j3"]{--pc:var(--yellow)}
.plate .pn{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,38px);line-height:.95;color:var(--fg)}
.plate .pd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.plate.on{border-color:var(--pc);box-shadow:0 10px 34px -14px var(--pc);transform:translateY(-2px)}
.plate.on .pd{color:var(--fg)}
.plate .badge{position:absolute;top:-6px;right:-4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--bg);border:3px solid var(--bg)}
.plate .badge.run{background:var(--bg);border:3px solid var(--pc)}
.plate .badge.run::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}

/* day header */
.dayhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:40px}
h2{font-size:26px}
.prio{color:var(--muted);margin:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);margin-top:4px}
.meta strong{color:var(--fg);font-weight:600}
.segs{display:flex;gap:4px;margin-top:2px}
.segs span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.segs span.on{background:var(--acc)}
.note{font-size:13px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.note b{color:var(--fg);font-weight:600}

/* exercise cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .2s}
.card.done{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:10px}
.hit{display:contents}
.pic{width:84px;height:64px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
.pic svg{width:100%;height:100%}
.info{min-width:0;text-align:left}
.name{font-weight:600;font-size:16px;line-height:1.2}
.card.done .name{color:var(--muted)}
.sm{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap}
.kg{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.kg small{font-size:15px;color:var(--muted);font-weight:700;margin-left:2px}
.unit{cursor:pointer;border-bottom:1px dashed var(--faint)}
.kg .unit{font-size:15px;color:var(--muted);font-weight:700;margin-left:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:17px;font-weight:600;text-align:left}
.opt.on{border-color:var(--acc)}
.opt .ou{color:var(--muted);font-size:13px;font-weight:600}
.opt svg{width:20px;height:20px;color:var(--green)}
.lb{font-size:12px;color:var(--faint)}
.chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;line-height:1.5;white-space:nowrap}
.chip.up{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.chip.down{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.chip.est{background:color-mix(in srgb,var(--yellow) 16%,transparent);color:var(--yellow)}
.chip.mute{background:var(--panel2);color:var(--muted)}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk.part{border-color:var(--acc)}
.chk.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.chk svg{width:20px;height:20px}

.det{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.cue{font-size:14px;color:var(--fg);margin:0}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:22px 84px minmax(0,1fr) 44px;gap:8px;align-items:center}
.sn{font-family:var(--display);font-weight:800;font-size:18px;color:var(--faint);text-align:center}
.set.ok .sn{color:var(--green)}
.wbox{position:relative}
.wt{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:600 17px var(--body);text-align:center;padding-right:22px;font-variant-numeric:tabular-nums}
.wbox span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.wbox .unit{padding:6px 2px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.step button{height:100%;font-size:22px;color:var(--muted)}
.step output{text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.step output small{font-weight:500;font-size:11px;color:var(--muted);margin-left:3px}
.sbtn{width:44px;height:44px;border-radius:12px;border:2px solid var(--faint);display:grid;place-items:center;color:transparent}
.sbtn.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.sbtn svg{width:18px;height:18px}
.hint{font-size:12px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.last{font-size:12.5px;color:var(--muted)}
.last b{color:var(--fg);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none;color:var(--fg)}
.pill svg{width:14px;height:14px}

.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:16px;background:var(--acc);color:var(--bg);font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin-top:16px;transition:opacity .2s}
.cta:disabled{opacity:.35;cursor:not-allowed}
.ghost{display:block;margin:12px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;color:var(--muted)}
.confirm button{height:36px;padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;color:var(--fg)}
.confirm button.danger{background:var(--red);border-color:var(--red);color:var(--bg)}

/* pictograms */
.pg .mc{stroke:var(--faint);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.pg .mt{stroke:var(--faint);stroke-width:2.5;stroke-linecap:round;fill:none}
.pg .pb{stroke:var(--fg);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.pg .hd{fill:var(--fg)}
.pg .gh{stroke:var(--fg);stroke-width:5;stroke-linecap:round;fill:none;opacity:.2}
.pg .ar{stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.pg .mf{fill:var(--faint);opacity:.55}
.pg .rl{stroke:var(--faint);stroke-width:3.5;fill:var(--panel2)}
.pg .pr{stroke:var(--acc);stroke-width:6;fill:none}
.pg .vt{fill:var(--muted);font:500 8px var(--body);text-anchor:middle}

/* progress tab */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:6px 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.25}
.sec{margin-block:22px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec span{font-size:12px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.lrow .pic{width:56px;height:44px;border-radius:8px}
.lrow .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.spark{display:block;margin-top:4px}
.spark .ln{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:color-mix(in srgb,var(--green) 14%,transparent)}
.spark .dot{fill:var(--green)}
.spark .tg{fill:var(--bg);stroke:var(--green);stroke-width:2}
.hist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.hh{display:flex;align-items:center;gap:8px;font-weight:600}
.hh i{width:10px;height:10px;border-radius:50%;background:var(--pc,var(--faint))}
.hh span{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.hl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:13.5px}
.hl .x{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.res-up{color:var(--green)}
.res-down{color:var(--red)}
.res-low{color:var(--yellow)}

/* ideas tab */
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box p{margin:0}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.box li::marker{color:var(--green)}
.sug{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start}
.sug .pic{width:56px;height:44px;border-radius:8px}
.sug .why{font-size:13.5px;color:var(--muted);margin-top:4px}
.sug .bt{grid-column:1 / -1;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.add{height:40px;padding:0 14px;border-radius:12px;background:var(--green);color:var(--bg);font-weight:700;font-size:14px}
.add.rm{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.vlist{display:flex;flex-direction:column;gap:10px}

/* rest timer + tab bar */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--acc);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);max-width:calc(100% - 32px)}
.rest .rt{font-family:var(--display);font-weight:800;font-size:22px;min-width:58px;font-variant-numeric:tabular-nums}
.rest .rl2{font-size:12px;color:var(--muted)}
.rest button{height:34px;padding:0 12px;white-space:nowrap;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--fg)}
.tabs button.on svg{color:var(--acc)}

/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(4,5,7,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--green)}
.sline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding-block:10px;border-top:1px solid var(--line)}
.sline .n{font-weight:600}
.sline .x{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sline .o{grid-column:1 / -1;font-size:13px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.row{grid-template-columns:68px minmax(0,1fr) 44px}.pic{width:68px;height:54px}.set{grid-template-columns:18px 74px minmax(0,1fr) 44px}}
</style>

<div class="app" id="app" data-day="j1" data-tab="seance">
  <header class="top">
    <div>
      <div class="brand"><b>Lat</b>Build</div>
      <div class="sub" id="sub">Programme débutant · Écono Fitness</div>
    </div>
    <div class="sync" id="sync" data-s="loading"><i></i><span>Connexion…</span></div>
  </header>
  <main id="view"></main>
</div>
<div class="rest" id="rest" hidden></div>
<div class="tabs">
  <nav id="tabs">
    <button data-act="tab" data-t="seance" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Séance</button>
    <button data-act="tab" data-t="progres">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M5 15l4-5 4 3 6-7"/></svg>Progrès</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Idées</button>
  </nav>
</div>
<div id="ovl"></div>

<script>
(function(){

/* ---------- program ---------- */
const BASE_DATE = "2026-10-11";
const EX = {
  legpress:{name:"Presse à jambes",mus:"Quadriceps · fessiers",inc:5,top:12,base:{w:70,reps:[12,12,12]},yt:"presse à cuisses 45 degrés technique",pg:"legpress"},

  row:{name:"Row assis",mus:"Milieu du dos · arrière d’épaules",inc:2.5,top:12,base:{w:40},yt:"rowing assis machine technique",pg:"row"},
  shoulderpress:{name:"Presse à épaules",mus:"Deltoïdes · triceps",inc:2.5,top:12,base:{w:15,est:true},yt:"développé épaules machine technique",pg:"shoulderpress"},
  legext:{name:"Extension des jambes",mus:"Quadriceps",inc:2.5,top:15,base:{w:30,est:true},yt:"leg extension machine technique",pg:"legext"},
  pecdeck:{name:"Pec deck · oiseau inversé",mus:"Arrière d’épaules · haut du dos",inc:2.5,top:15,base:{w:35},yt:"pec deck oiseau inversé reverse fly technique",pg:"pecdeck"},
  latclose:{name:"Tirage vertical prise serrée",mus:"Grand dorsal",inc:2.5,top:12,base:{w:35,est:true},yt:"tirage vertical prise serrée neutre technique",pg:"latpull",sug:true},
  backext:{name:"Extension lombaire 45°",mus:"Bas du dos · fessiers",inc:2.5,top:15,base:{w:0,est:true},yt:"extension lombaire banc 45 degrés technique",pg:"plate",sug:true},
  calf:{name:"Mollets à la presse",mus:"Mollets",inc:5,top:15,base:{w:50,est:true},yt:"mollets à la presse à cuisses technique",pg:"legpress",sug:true},
  abductor:{name:"Abducteurs (machine)",mus:"Moyen fessier",inc:2.5,top:15,base:{w:30,est:true},yt:"machine abducteurs hanches technique",pg:"plate",sug:true},

function allIds(){

}
function spark(vals){
  if (vals.length < 2) return "";
  const w = 112, h = 30, p = 4, mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn;
  const pts = vals.map((v,i) => [p + i*(w-2*p)/(vals.length-1), r ? h - p - (v-mn)/r*(h-2*p) : h/2]);
  const d = pts.map((q,i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join("");
  const lastP = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="ar" d="${d}L${lastP[0].toFixed(1)} ${h}L${p} ${h}Z"/><path class="ln" d="${d}"/>${pts.slice(0,-1).map(q => `<circle class="dot" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2"/>`).join("")}<circle class="tg" cx="${lastP[0].toFixed(1)}" cy="${lastP[1].toFixed(1)}" r="3.5"/></svg>`;
}

/* ---------- actions ---------- */
function findItem(id){ return items(ui.day).find(i => i.id === id); }
function finish(){
  const day = ui.day, L = S.live[day]; if (!L) return;
  const date = iso(new Date()), entries = [];
  items(day).forEach(it => {
    const sets = L.sets[it.id]; if (!sets) return;
    const done = sets.filter(s => s.d); if (!done.length) return;
    const freq = {}; done.forEach(s => { freq[s.w] = (freq[s.w] || 0) + 1; });
    const w = +Object.keys(freq).sort((a,b) => freq[b] - freq[a] || b - a)[0];
    const reps = done.map(s => s.r), st = S.ex[it.id];
    const top = done.length === sets.length && reps.every(r => r >= it.max);
    const low = reps.some(r => r < it.min);
    let next = w, result;
    if (top){ next = w + st.inc; result = "up"; st.fails = 0; }
    else if (low){ st.fails = (st.fails || 0) + 1; if (st.fails >= 2){ next = Math.max(0, roundTo(w*0.9, st.inc)); result = "down"; st.fails = 0; } else result = "low"; }
    else { result = "hold"; st.fails = 0; }
    st.w = next; st.est = false; st.last = {w, reps, date};
    entries.push({id:it.id, w, reps, sets:sets.length, min:it.min, max:it.max, result, next});
  });
  if (!entries.length) return;
  const s = {id:"s" + Date.now(), day, date, finishedAt:Date.now(), entries};
  SESS.push(s); delete S.live[day]; ui.open.clear(); ui.confirm = false; stopRest();
  save(); pushSession(s);
  ui.sheet = s; render();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "close-sheet"){ if (ev.target.closest("[data-stop]") && t.classList.contains("ov")) return; ui.sheet = null; render(); return; }
  if (a === "tab"){ ui.tab = t.dataset.t; ui.confirm = false; render(); window.scrollTo(0,0); return; }
  if (a === "unit"){ ui.unitMenu = t.dataset.ex; render(); return; }
  if (a === "unit-pick"){ const st = S.ex[t.dataset.ex]; if (st) st.unit = t.dataset.u; ui.unitMenu = null; save(); render(); return; }
  if (a === "close-unit"){ if (ev.target.closest("[data-stop]") && t.classList.contains("ov")) return; ui.unitMenu = null; render(); return; }
  if (a === "day"){ ui.day = t.dataset.d; ui.open.clear(); ui.confirm = false; render(); return; }
  if (a === "rest-close"){ stopRest(); return; }
  if (a === "rest-add"){ if (rest) rest.end = Math.max(rest.end, Date.now()) + 30000; drawRest(); return; }
  if (a === "toggle"){ const id = t.dataset.ex; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); return; }
  if (a === "check"){
    const it = findItem(t.dataset.ex), sets = liveSets(ui.day, it), all = sets.every(s => s.d);
    sets.forEach(s => { s.d = !all; }); if (!all) keepAwake(); save(); render(); return;
  }
  if (a === "set"){
    const it = findItem(t.dataset.ex), sets = liveSets(ui.day, it), s = sets[+t.dataset.i];
    s.d = !s.d; save(); render(); if (s.d){ if (sets.every(x => x.d)) stopRest(); else startRest(); } return;
  }
  if (a === "rep"){
    const it = findItem(t.dataset.ex), s = liveSets(ui.day, it)[+t.dataset.i];
    s.r = Math.max(0, Math.min(40, s.r + (+t.dataset.dv))); save(); render(); return;
  }
  if (a === "inc"){
    const st = S.ex[t.dataset.ex], steps = [1, 2.5, 5];
    st.inc = steps[(steps.indexOf(st.inc) + 1) % steps.length]; save(); render(); return;
  }
  if (a === "export"){
    const txt = JSON.stringify({app:"latbuild", S, SESS});
    if (navigator.share){ navigator.share({title:"Sauvegarde LatBuild", text:txt}).catch(()=>{}); }
    else if (navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>alert("Sauvegarde copiée. Colle-la dans une note.")).catch(()=>prompt("Copie ce texte :", txt)); }
    else { prompt("Copie ce texte :", txt); }
    return;
  }
  if (a === "import"){
    const txt = prompt("Colle ici ta sauvegarde LatBuild :"); if (!txt) return;
    try {
      const o = JSON.parse(txt); if (!o || o.app !== "latbuild" || !o.S) throw 0;
      S = normalize(o.S); SESS = Array.isArray(o.SESS) ? o.SESS : []; S.updatedAt = Date.now(); lsSet(); render(); alert("Sauvegarde restaurée.");
    } catch(e){ alert("Ce texte n'est pas une sauvegarde valide."); }
    return;
  }
  if (a === "finish"){ finish(); return; }
  if (a === "cancel"){ ui.confirm = true; render(); return; }
  if (a === "cancel-no"){ ui.confirm = false; render(); return; }
  if (a === "cancel-yes"){ delete S.live[ui.day]; ui.confirm = false; stopRest(); save(); render(); return; }
  if (a === "add" || a === "remove"){
    const sg = SUG.find(x => x.id === t.dataset.sug); if (!sg) return;
    if (a === "add"){ if (!S.added[sg.day].some(x => x.id === sg.id)) S.added[sg.day].push({id:sg.id, sets:sg.sets, min:sg.min, max:sg.max, cue:sg.cue}); if (!S.ex[sg.id]) S.ex[sg.id] = initEx(sg.id, S); }
    else { S.added[sg.day] = S.added[sg.day].filter(x => x.id !== sg.id); if (S.live[sg.day]) delete S.live[sg.day].sets[sg.id]; }
    save(); render(); return;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target; if (!t.matches || !t.matches(".wt")) return;
  const v = parseFloat(String(t.value).replace(",", "."));
  const it = findItem(t.dataset.ex);
  if (!it || !isFinite(v) || v < 0 || v > (U(it.id) === "lb" ? 1100 : 500)){ render(); return; }
  const sets = liveSets(ui.day, it), i = +t.dataset.i, old = sets[i].w;
  sets[i].w = kgOf(it.id, v);
  for (let k = i+1; k < sets.length; k++) if (!sets[k].d && sets[k].w === old) sets[k].w = sets[i].w;
  save(); render();
});
